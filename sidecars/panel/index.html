<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antigravity Skin</title>
  <link rel="stylesheet" href="/theme.css?v=skin-panel-2">
  <link rel="stylesheet" href="/styles.css?v=skin-panel-2">
  <script src="/preload.js"></script>
  <script defer src="/app.js?v=skin-panel-2"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="sparkle" viewBox="0 0 16 16"><path d="M8 1.5l1.4 4.1 4.1 1.4-4.1 1.4L8 12.5 6.6 8.4 2.5 7l4.1-1.4z"/><path d="M12.5 11.5l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/></symbol>
    <symbol id="shield" viewBox="0 0 16 16"><path d="M8 1.8l5 2v4.1c0 3.1-2.1 5.4-5 6.3-2.9-.9-5-3.2-5-6.3V3.8z"/></symbol>
    <symbol id="refresh" viewBox="0 0 16 16"><path d="M12.8 6a5.1 5.1 0 1 0 .1 4M12.8 2.5V6H9.2"/></symbol>
    <symbol id="folder" viewBox="0 0 16 16"><path d="M2 4.2A1.2 1.2 0 0 1 3.2 3h3l1.3 1.5h5.3A1.2 1.2 0 0 1 14 5.7v6.1a1.2 1.2 0 0 1-1.2 1.2H3.2A1.2 1.2 0 0 1 2 11.8z"/></symbol>
  </svg>

  <main class="skin-panel" aria-label="Antigravity Skin control panel">
    <header class="panel-header">
      <div class="brand">
        <svg class="icon"><use href="#sparkle"/></svg>
        <span class="brand-title">Antigravity Skin</span>
        <span class="platform-badge" id="platform-badge">—</span>
        <span class="connection-dot" id="connection-dot" title="Engine status"></span>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="refresh-button" type="button" title="刷新配置与状态" aria-label="刷新配置与状态">
          <svg class="icon"><use href="#refresh"/></svg>
        </button>
      </div>
    </header>

    <div class="panel-scroll">
      <!-- 1. 插件通道与立即修复 -->
      <section class="panel-card repair-card" id="repair-card">
        <div class="card-header">
          <span class="card-title"><svg class="icon"><use href="#shield"/></svg><span data-t="repairTitle">插件通道状态</span></span>
          <div class="repair-header-right">
            <span class="status-pill" id="patch-state-pill">检测中…</span>
            <button type="button" id="force-repair-btn" class="btn btn-xs" data-t="forceRepair">重新修复</button>
          </div>
        </div>

        <section id="patch-repair-banner" class="patch-repair-banner" hidden>
          <div class="banner-body">
            <strong id="patch-repair-text">检测到反重力未激活插件通道（首次安装 / 版本已更新）</strong>
            <span class="banner-sub" id="patch-repair-sub">点击下方按钮自动注入并重启客户端即可生效。</span>
          </div>
          <button type="button" id="patch-repair-btn" class="btn btn-warning">立即修复并重启</button>
        </section>

        <div class="repair-inline-meta">
          <span><em data-t="cdpLabel">热同步</em>: <strong id="meta-cdp">—</strong></span>
          <span><em data-t="backupLabel">备份</em>: <strong id="meta-backup">—</strong></span>
          <span class="save-hint" id="repair-feedback"></span>
        </div>
      </section>

      <!-- 2. 界面与交互 -->
      <section class="panel-card">
        <div class="card-header">
          <span class="card-title" data-t="generalTitle">界面与交互</span>
          <span class="card-hint" data-t="syncHint">与「外观」菜单同步</span>
        </div>
        <div class="setting-list">
          <label class="toggle-row">
            <span><strong data-t="chineseLoc">界面汉化 (中文)</strong><small data-t="chineseLocDesc">切换界面与看板语言</small></span>
            <input type="checkbox" id="cfg-chineseLocalization">
          </label>
          <div class="field-row" id="chat-style-row">
            <label for="cfg-chatStyleMode" data-t="chatStyle">对话气泡样式</label>
            <select id="cfg-chatStyleMode">
              <option value="bubble" data-t="chatBubble">气泡卡片 (Bubble)</option>
              <option value="native" data-t="chatNative">原生透底 (Native)</option>
            </select>
          </div>
          <label class="toggle-row">
            <span><strong data-t="inlineDash">对话栏内嵌看板</strong><small data-t="inlineDashDesc">在输入框旁显示轻量指标条</small></span>
            <input type="checkbox" id="cfg-dashboardInline">
          </label>
        </div>
      </section>

      <!-- 3. 动态壁纸 -->
      <section class="panel-card" id="wallpaper-card">
        <div class="card-header">
          <span class="card-title" data-t="wallpaperTitle">动态壁纸</span>
          <input type="checkbox" class="header-switch" id="cfg-dw-enabled" aria-label="启用动态壁纸">
        </div>
        <div class="setting-list" id="wallpaper-options">
          <div class="field-row">
            <label for="cfg-dw-sourceType" data-t="sourceType">素材类型</label>
            <select id="cfg-dw-sourceType">
              <option value="video" data-t="sourceVideo">内置视频 (Video)</option>
              <option value="scene" data-t="sourceScene">场景素材库 (Scene)</option>
            </select>
          </div>
          <div class="field-row" id="dw-video-row">
            <label for="cfg-dw-videoPath" data-t="selectVideo">选择壁纸视频</label>
            <select id="cfg-dw-videoPath"></select>
          </div>
          <div class="field-row" id="dw-scene-row" hidden>
            <label for="cfg-dw-wallpaperDir" data-t="selectScene">选择场景壁纸</label>
            <select id="cfg-dw-wallpaperDir"></select>
          </div>
          <div class="field-row">
            <label for="cfg-dw-fit" data-t="fitMode">画面适配</label>
            <select id="cfg-dw-fit">
              <option value="cover" data-t="fitCover">填充裁切 (Cover)</option>
              <option value="contain" data-t="fitContain">完整适应 (Contain)</option>
              <option value="fill" data-t="fitFill">拉伸铺满 (Fill)</option>
            </select>
          </div>
          <div class="slider-row">
            <div class="slider-head"><span data-t="brightness">亮度</span><strong id="val-dw-brightness">0.85</strong></div>
            <input type="range" id="cfg-dw-brightness" min="0.2" max="1.5" step="0.05">
          </div>
          <div class="slider-row">
            <div class="slider-head"><span data-t="contrast">对比度</span><strong id="val-dw-contrast">1.05</strong></div>
            <input type="range" id="cfg-dw-contrast" min="0.5" max="1.8" step="0.05">
          </div>
          <label class="toggle-row">
            <span><strong data-t="audioEnable">背景音频</strong></span>
            <input type="checkbox" id="cfg-dw-audioEnabled">
          </label>
          <label class="toggle-row">
            <span><strong data-t="interactionEnable">鼠标视差与滚轮交互</strong></span>
            <input type="checkbox" id="cfg-dw-interaction">
          </label>
        </div>
      </section>

      <!-- 4. 开机动画 -->
      <section class="panel-card" id="boot-card">
        <div class="card-header">
          <span class="card-title" data-t="bootTitle">开机动画</span>
          <input type="checkbox" class="header-switch" id="cfg-boot-enabled" aria-label="启用开机动画">
        </div>
        <div class="setting-list" id="boot-options">
          <div class="field-row">
            <label for="cfg-boot-type" data-t="bootType">动效类型</label>
            <select id="cfg-boot-type">
              <option value="video" data-t="bootVideo">短视频 (Video)</option>
              <option value="code" data-t="bootCode">代码动效 (Script)</option>
            </select>
          </div>
          <div class="field-row" id="boot-video-row">
            <label for="cfg-boot-videoPath" data-t="selectBootVideo">启动视频</label>
            <select id="cfg-boot-videoPath"></select>
          </div>
          <div class="field-row" id="boot-script-row" hidden>
            <label for="cfg-boot-scriptPath" data-t="selectBootScript">动效脚本</label>
            <select id="cfg-boot-scriptPath"></select>
          </div>
          <div class="slider-row">
            <div class="slider-head"><span data-t="bootDelay">自动进入延迟 (秒)</span><strong id="val-boot-delay">3s</strong></div>
            <input type="range" id="cfg-boot-delay" min="1" max="10" step="1">
          </div>
        </div>
      </section>

      <!-- 5. 外部壁纸库 -->
      <section class="panel-card">
        <div class="card-header">
          <span class="card-title" data-t="libraryTitle">外部壁纸库</span>
          <button type="button" id="pick-library-btn" class="btn btn-xs">
            <svg class="icon"><use href="#folder"/></svg><span data-t="pickDir">选择目录</span>
          </button>
        </div>
        <div class="path-box" id="cfg-lib-path" title="">未配置目录</div>
      </section>
    </div>

    <footer class="panel-footer">
      <span id="status-note">就绪</span>
    </footer>
  </main>
</body>
</html>
